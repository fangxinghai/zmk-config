# Bluetooth
CONFIG_BT=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE=y

# 蓝牙连接参数优化
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 蓝牙重连修复（关键三项）
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# BLE TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# LED Strip
CONFIG_LED_STRIP=y
CONFIG_SPI=y

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_KEYMAP_SENSORS=y


# UART + CDC ACM
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_CDC_ACM=y

# Custom modules
CONFIG_CUSTOM_BLE_TOGGLE=y


CONFIG_ZMK_RGB_UNDERGLOW=y

# ── 背光 underglow 默认设置 ──
CONFIG_ZMK_RGB_UNDERGLOW=y

# 默认颜色：白色（饱和度=0 即为白光）
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0        
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60      

# 默认灯效：纯色常亮（不要彩虹流动）
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0  

# 开机自动打开背光
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
